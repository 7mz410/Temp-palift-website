<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PALIFT | حلول المناولة والرفع والتخزين</title>
<meta name="description" content="PALIFT Equipment Trading Co. — الوكيل الحصري لعلامة Noblelift في فلسطين. رافعات شوكية، مكدسات وناقلات طبالي، منصات عمل، آلات تنظيف وأنظمة رفوف، مع خدمات ما بعد البيع.">
<link rel="icon" href="brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="topbar">
    <div class="wrap">
      <span class="item"><span class="ms">call</span><a class="ltr" href="tel:+970567888444">056 788 8444</a></span>
      <span class="item"><span class="ms">mail</span><a class="ltr" href="mailto:info@palift.ps">info@palift.ps</a></span>
      <span class="spacer"></span>
      <span class="item hours"><span class="ms">schedule</span><span data-t="hours"></span></span>
    </div>
  </div>

  <header>
    <div class="wrap">
      <img class="logo" src="brand/logo-white.png" alt="PALIFT">
      <nav id="mainNav"></nav>
      <a href="#contact" class="btn-quote"><span class="ms">request_quote</span><span data-t="getQuote"></span></a>
    </div>
  </header>

  <section id="home">
    <img class="hero-pattern-red" src="images/pattern-red.png" alt="">
    <img class="hero-pattern-gray" src="images/pattern-gray.png" alt="">
    <div class="wrap hero-inner">
      <div class="hero-grid">
        <div>
          <span class="hero-badge"><span class="ms">verified</span><span data-t="badge"></span></span>
          <h1 class="hero-title" data-t="heroTitle"></h1>
          <p class="hero-sub" data-t="heroSub"></p>
          <div class="hero-ctas">
            <a href="#contact" class="btn-primary"><span data-t="ctaQuote"></span></a>
            <a href="#products" class="btn-outline"><span data-t="ctaBrowse"></span></a>
          </div>
        </div>
        <div class="hero-visual">
          <div class="hero-gallery" id="heroGallery"></div>
          <div class="hero-dots" id="heroDots"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="message-strip">
    <div class="msg-inner">
      <span class="ms">format_quote</span>
      <p data-t="brandMessage"></p>
    </div>
  </section>

  <section id="about">
    <div class="section-head">
      <div>
        <div class="kicker"><span class="bar"></span><span data-t="kickerAbout"></span></div>
        <h2 data-t="aboutTitle"></h2>
      </div>
    </div>
    <div class="about-grid">
      <p class="about-body" data-t="aboutBody"></p>
      <div class="vm-grid">
        <div class="vm-card">
          <span class="ms">visibility</span>
          <div class="vm-title" data-t="visionTitle"></div>
          <p data-t="visionBody"></p>
        </div>
        <div class="vm-card">
          <span class="ms">flag</span>
          <div class="vm-title" data-t="missionTitle"></div>
          <p data-t="missionBody"></p>
        </div>
      </div>
    </div>
    <div class="why-block">
      <div class="why-head" data-t="whyTitle"></div>
      <div class="why-grid" id="whyGrid"></div>
    </div>
  </section>

  <section id="products">
    <div class="section-head">
      <div>
        <div class="kicker"><span class="bar"></span><span data-t="kickerProducts"></span></div>
        <h2 data-t="productsTitle"></h2>
      </div>
    </div>
    <p class="section-lead" data-t="productsLead"></p>
    <div class="cat-grid" id="catGrid"></div>
  </section>

  <section id="solutions">
    <div class="section-head">
      <div>
        <div class="kicker"><span class="bar"></span><span data-t="kickerTasks"></span></div>
        <h2 data-t="tasksTitle"></h2>
      </div>
    </div>
    <p class="section-lead" data-t="tasksLead"></p>
    <div class="table-card">
      <table class="pf-table">
        <thead><tr><th data-t="thTask"></th><th data-t="thPath"></th></tr></thead>
        <tbody id="taskRows"></tbody>
      </table>
    </div>

    <div class="section-head sectors-head">
      <div>
        <div class="kicker"><span class="bar"></span><span data-t="kickerSectors"></span></div>
        <h2 data-t="sectorsTitle"></h2>
      </div>
    </div>
    <div class="sector-grid" id="sectorGrid"></div>
  </section>

  <section id="services">
    <div class="wrap">
      <div class="section-head">
        <div>
          <div class="kicker"><span class="bar"></span><span data-t="kickerServices"></span></div>
          <h2 data-t="servicesTitle"></h2>
        </div>
      </div>
      <p class="section-lead" data-t="servicesLead"></p>
      <div class="services-grid" id="serviceGrid"></div>
      <div class="notice">
        <span class="ms">info</span>
        <div>
          <div class="notice-title" data-t="financeTitle"></div>
          <p data-t="financeBody"></p>
        </div>
      </div>
    </div>
  </section>

  <section id="choose">
    <div class="section-head">
      <div>
        <div class="kicker"><span class="bar"></span><span data-t="kickerChoose"></span></div>
        <h2 data-t="chooseTitle"></h2>
      </div>
    </div>
    <p class="section-lead" data-t="chooseLead"></p>
    <div class="check-grid" id="checkGrid"></div>
    <div class="result-card">
      <span class="ms">task_alt</span>
      <div>
        <div class="result-title" data-t="resultTitle"></div>
        <p data-t="resultBody"></p>
      </div>
    </div>
  </section>

  <section id="contact">
    <svg class="bg" width="420" height="100%" viewBox="0 0 420 380" preserveAspectRatio="xMinYMid slice">
      <polygon points="0,0 200,0 0,240" fill="#921A1D" opacity="0.55"></polygon>
      <polygon points="0,240 200,0 200,240" fill="#921A1D" opacity="0.2"></polygon>
    </svg>
    <div class="contact-inner">
      <div>
        <div class="kicker light"><span class="bar"></span><span data-t="kickerContact"></span></div>
        <h2 class="contact-title" data-t="contactTitle"></h2>
        <p class="contact-body" data-t="contactBody"></p>
        <div class="contact-lines" id="contactLines"></div>
      </div>
      <form class="contact-form" id="quoteForm">
        <div class="form-title" data-t="formTitle"></div>
        <div class="form-grid" id="formGrid">
          <div class="col-full" id="messageField">
            <label></label>
            <textarea rows="3"></textarea>
          </div>
        </div>
        <button type="submit" class="btn-send btn-wa"><span class="ms">chat</span><span data-t="sendWhatsapp"></span></button>
        <button type="button" class="btn-mail" id="mailBtn"><span class="ms">mail</span><span data-t="sendMail"></span></button>
        <p class="form-note" data-t="formNote"></p>
      </form>
    </div>
  </section>

  <footer>
    <div class="footer-grid">
      <div>
        <img class="footer-logo" src="brand/logo-white.png" alt="PALIFT">
        <div class="footer-slogan" data-t="slogan"></div>
        <p class="footer-blurb" data-t="footerBlurb"></p>
      </div>
      <div id="footerCols" style="display:contents;"></div>
    </div>
    <p class="footer-disclaimer" data-t="disclaimer"></p>
    <div class="footer-bottom">
      <div class="footer-bottom-inner">
        <span data-t="copyright"></span>
        <span class="spacer"></span>
        <span data-t="addressShort"></span>
      </div>
    </div>
  </footer>

  <a class="wa-float" id="waFloat" href="#" aria-label="واتساب"><span class="ms">chat</span></a>

<script src="js/main.js"></script>
</body>
</html>
