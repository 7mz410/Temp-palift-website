<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palift Equipment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="topbar">
    <div class="wrap">
      <span class="item"><span class="ms">call</span>+970 2 298 4400</span>
      <span class="item"><span class="ms">mail</span>sales@palift.ps</span>
      <span class="spacer"></span>
      <span class="item hours"><span class="ms">schedule</span><span data-t="hours"></span></span>
      <button id="langToggle"><span class="ms">language</span><span id="langLabel"></span></button>
    </div>
  </div>

  <header>
    <div class="wrap">
      <img class="logo" src="brand/logo-white.png" alt="Palift Equipment">
      <nav id="mainNav"></nav>
      <a href="#contact" class="btn-quote"><span class="ms">request_quote</span><span data-t="getQuote"></span></a>
    </div>
  </header>

  <section id="stock">
    <img class="hero-pattern-red" src="images/pattern-red.png" alt="">
    <img class="hero-pattern-gray" src="images/pattern-gray.png" alt="">
    <div class="wrap hero-inner">
      <div class="hero-grid">
        <div>
          <h1 class="hero-title" data-t="heroTitle"></h1>
          <p class="hero-sub" data-t="heroSub"></p>
          <div class="hero-ctas">
            <a href="#machines" class="btn-primary"><span data-t="browseStock"></span></a>
            <a href="#service" class="btn-outline"><span data-t="bookService"></span></a>
          </div>
        </div>
        <div class="hero-visual">
          <div class="hero-gallery" id="heroGallery"></div>
          <div class="hero-dots" id="heroDots"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="search">
    <div class="wrap search-wrap">
      <div class="search-head">
        <span class="ms">manage_search</span>
        <div class="title" data-t="findMachine"></div>
        <span class="spacer"></span>
        <div class="count" id="stockCount"></div>
      </div>
      <div class="search-grid" id="filterGrid">
        <button class="btn-search"><span class="ms">search</span><span data-t="search"></span></button>
      </div>
    </div>
  </section>

  <section id="machines">
    <div class="section-head">
      <div>
        <div class="kicker"><span class="bar"></span><span data-t="kickerStock"></span></div>
        <h2 data-t="featuredTitle"></h2>
      </div>
      <span class="spacer1"></span>
      <a href="#stock" class="view-all"><span data-t="viewAll"></span><span class="ms" id="viewAllArrow">arrow_forward</span></a>
    </div>
    <div class="machine-grid" id="machineGrid"></div>
  </section>

  <section id="parts">
    <div class="kicker"><span class="bar"></span><span data-t="kickerCats"></span></div>
    <h2 data-t="catsTitle" style="margin:12px 0 30px;"></h2>
    <div class="cat-grid" id="catGrid"></div>
  </section>

  <section id="service">
    <div class="wrap">
      <div class="service-grid">
        <div>
          <div class="kicker"><span class="bar"></span><span data-t="kickerService"></span></div>
          <h2 data-t="serviceTitle"></h2>
          <p class="service-body" data-t="serviceBody"></p>
          <div class="stats-row" id="statsRow"></div>
        </div>
        <div class="services-grid" id="serviceGrid"></div>
      </div>
    </div>
  </section>

  <section id="company">
    <div class="section-head">
      <div>
        <div class="kicker"><span class="bar"></span><span data-t="kickerTeam"></span></div>
        <h2 data-t="teamTitle"></h2>
      </div>
    </div>
    <div class="team-grid" id="teamGrid"></div>
  </section>

  <section id="contact">
    <svg class="bg" width="420" height="100%" viewBox="0 0 420 380" preserveAspectRatio="xMinYMid slice">
      <polygon points="0,0 200,0 0,240" fill="#921A1D" opacity="0.55"></polygon>
      <polygon points="0,240 200,0 200,240" fill="#921A1D" opacity="0.2"></polygon>
    </svg>
    <div class="contact-inner">
      <div>
        <h2 class="contact-title" data-t="contactTitle"></h2>
        <p class="contact-body" data-t="contactBody"></p>
        <div class="contact-lines" id="contactLines"></div>
      </div>
      <div class="contact-form">
        <div class="form-title" data-t="formTitle"></div>
        <div class="form-grid" id="formGrid">
          <div class="col-full" id="messageField">
            <label></label>
            <textarea rows="3"></textarea>
          </div>
        </div>
        <button class="btn-send" data-t="sendRequest"></button>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-grid">
      <div>
        <img class="footer-logo" src="brand/logo-white.png" alt="Palift Equipment">
        <p class="footer-blurb" data-t="footerBlurb"></p>
      </div>
      <div id="footerCols" style="display:contents;"></div>
    </div>
    <div class="footer-bottom">
      <div class="footer-bottom-inner">
        <span data-t="copyright"></span>
        <span class="spacer"></span>
        <span data-t="vatLine"></span>
      </div>
    </div>
  </footer>

<script src="js/main.js"></script>
</body>
</html>
